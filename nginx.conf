server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Rota principal e suporte a slugs sem extensão (.html)
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Slug /back
    location /back {
        try_files $uri $uri.html $uri/ /back.html;
    }

    # Slug /back-redirect
    location /back-redirect {
        try_files $uri $uri.html $uri/ /back-redirect.html;
    }

    # Slug /upsell
    location /upsell {
        try_files $uri $uri.html $uri/ /upsell.html;
    }

    # Slug /certificado
    location /certificado {
        try_files $uri $uri/ /certificado/index.html;
    }

    # Servir assets com cache
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript text/html;
}
